[project]
name = "tower-backend"
version = "0.1.0"
description = "Tower: simulator, planner, AI pilots, Tower core, resolver agent, WebSocket hub"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "openai>=1.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "websockets>=12",
  "soundfile>=0.12",
  "scipy>=1.13",
  "rapidfuzz>=3.9",
  "faster-whisper>=1.0",
  "pyyaml>=6.0",
  "silero-vad>=6.0",
  "onnxruntime>=1.20",
  "matplotlib>=3.8",
  "elasticsearch>=8.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # this checkout first: the venv is an editable install that points at another clone
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
